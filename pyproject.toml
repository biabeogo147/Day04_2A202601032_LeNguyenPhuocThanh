[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "day04-tpcn-react-agent"
version = "0.1.0"
description = "LangGraph ReAct advisor for dietary supplements"
requires-python = ">=3.10"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "chromadb>=0.5,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-chroma>=0.2,<2",
  "langchain-google-genai>=2,<4",
  "langchain-openai>=0.3,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sse-starlette>=2.1,<4",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "live: calls a paid external model provider and is skipped without its API key",
]

[tool.ruff]
line-length = 100
target-version = "py310"
